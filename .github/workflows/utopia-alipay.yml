name: New Utopia Alipay checks

on:
  push:
    branches: ['utopia/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALIPAY_TEST_REDIS_ADDR: '127.0.0.1:6379'
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: utopia_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: utopia
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: utopia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U utopia"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: SQLite payment regression
        run: go test ./controller -run '^TestAlipayF2F$' -count=1 -v
      - name: Record Redis version
        run: docker exec $(docker ps -q --filter ancestor=redis:7) redis-server --version
      - name: MySQL payment regression
        env:
          ALIPAY_TEST_DIALECT: mysql
          ALIPAY_TEST_DSN: 'root:test-only@tcp(127.0.0.1:3306)/utopia_test?charset=utf8mb4&parseTime=true'
        run: go test ./controller -run '^TestAlipayF2F$' -count=1 -v
      - name: PostgreSQL payment regression
        env:
          ALIPAY_TEST_DIALECT: postgres
          ALIPAY_TEST_DSN: 'postgres://utopia:test-only@127.0.0.1:5432/utopia_test?sslmode=disable'
        run: go test ./controller -run '^TestAlipayF2F$' -count=1 -v
      - name: Existing payment regressions
        run: |
          go test ./model -run 'Alipay|TopUp|Topup|Recharge|Payment|Epay|Quota|Reserve|Redemption|Redeem|AuthCache|UserAuth' -count=1
          go test ./controller ./service ./middleware -run 'Alipay|TopUp|Topup|Recharge|Payment|Epay|RateLimit' -count=1
      - name: Upstream rc.50 integration regressions
        run: |
          go test ./model ./service ./relay/... ./pkg/billingexpr/... ./pkg/jsplugin/... ./plugins/... ./router/... ./setting/... ./common/... -count=1
          go test ./controller -run 'Plugin|Sensitive|SystemTask|Epay' -count=1
          (cd relaykit && GOWORK=off go build ./...)
          (cd tokenkit && GOWORK=off go build ./...)
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test src/features/wallet src/features/system-settings/integrations src/features/request-processing src/features/system-info src/features/task-plugins
      - name: Lint modified frontend files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only v1.0.0-rc.50 HEAD -- '*.ts' '*.tsx')
          bunx oxlint -c .oxlintrc.json "${files[@]#web/}"
      - run: bun run build

  image:
    name: Build and smoke-test image (${{ matrix.arch }})
    needs: [payment, frontend]
    if: github.repository == 'HeartEase1/new-utopia-api' && github.ref == 'refs/heads/utopia/alipay-rc49'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Set image version
        run: echo "v1.0.0-rc.50-utopia-${GITHUB_SHA:0:12}" > VERSION
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: ghcr.io/heartease1/new-utopia-api:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/HeartEase1/new-utopia-api
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=utopia-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=utopia-${{ matrix.arch }}
      - name: Verify container startup and embedded frontend
        env:
          IMAGE: ghcr.io/heartease1/new-utopia-api:sha-${{ github.sha }}-${{ matrix.arch }}
        run: |
          docker run -d --name utopia-smoke -p 127.0.0.1:3000:3000 "$IMAGE"
          trap 'docker logs utopia-smoke; docker rm -f utopia-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/status > /tmp/status.json; then
              break
            fi
            sleep 2
          done
          jq -e '.success == true' /tmp/status.json
          curl -fsS http://127.0.0.1:3000/ | grep -q '<html'
          docker push "$IMAGE"

  migration:
    name: Verify rc.50 fresh install and rc.49 upgrade
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: utopia
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U utopia"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Verify production startup migrations twice per database
        env:
          UPGRADE_IMAGE: ghcr.io/heartease1/new-utopia-api:sha-${{ github.sha }}-amd64
        run: sudo --preserve-env=UPGRADE_IMAGE python3 .github/scripts/verify-rc50-upgrade.py

  publish:
    name: Publish multi-architecture image
    needs: [image, migration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    # Preserve the moving tag for existing Compose deployments; also record rollback identifiers.
    concurrency: utopia-image-publish
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and record immutable image address
        env:
          IMAGE: ghcr.io/heartease1/new-utopia-api
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:sha-$GITHUB_SHA" \
            -t "$IMAGE:rc49-alipay" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" \
            "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" | tee /tmp/image.txt
          DIGEST=$(awk '/^Digest:/ {print $2; exit}' /tmp/image.txt)
          test -n "$DIGEST"
          echo "### Deploy this tested image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit tag: \`$IMAGE:sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
